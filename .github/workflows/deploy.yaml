name: Test, publish and deploy
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/gitops/values-production.yaml', '**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uvx ruff==0.15.9 check apps/api
      - run: uv run python scripts/check_simplified_surface.py
        working-directory: apps/api
        env:
          LEARNHOUSE_AUTH_JWT_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
      - run: uv run pytest src/tests/ -n auto --dist worksteal -q --tb=short
        working-directory: apps/api
        env:
          TESTING: 'true'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run test
        working-directory: apps/web
      - run: bunx tsc --noEmit
        working-directory: apps/web
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v4.3.1
      - run: pip install PyYAML==6.0.3
      - run: |
          helm lint deploy/helm/learnhouse --strict
          helm lint deploy/helm/learnhouse-infra --strict
          python deploy/helm/learnhouse/test_chart.py
          helm template learnhouse deploy/helm/learnhouse --namespace learnhouse -f deploy/gitops/values-production.yaml > /tmp/production.yaml
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: learnhouse
          POSTGRES_PASSWORD: learnhouse
          POSTGRES_DB: learnhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEARNHOUSE_SQL_CONNECTION_STRING: postgresql://learnhouse:learnhouse@localhost:5432/learnhouse
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
      PGPASSWORD: learnhouse
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14.7"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: apps/api

      - name: New install (empty database)
        working-directory: apps/api
        run: |
          uv run python cli.py migrate --strict
          uv run python cli.py migrate --status

      - name: Upgrade from the base branch
        # The path every existing install takes: the previous release's
        # schema, stamped, then this branch's migrations. --strict fails
        # when a model changed without a migration.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          psql -h localhost -U learnhouse -d postgres -c "DROP DATABASE learnhouse WITH (FORCE)" -c "CREATE DATABASE learnhouse"
          git worktree add --detach /tmp/base "$BASE_SHA"
          (cd /tmp/base/apps/api && "$GITHUB_WORKSPACE/apps/api/.venv/bin/python" "$GITHUB_WORKSPACE/apps/api/scripts/ci_schema_baseline.py")
          cd apps/api
          uv run python cli.py migrate --strict
          uv run python cli.py migrate --status

      - name: Upgrade an install that was never stamped
        # Installs made by create_all before migrations ran on startup: the
        # base schema without its alembic_version row.
        if: github.event_name == 'pull_request'
        run: |
          psql -h localhost -U learnhouse -d learnhouse -c "DROP TABLE alembic_version" -c "ALTER TABLE course DROP COLUMN IF EXISTS about"
          cd apps/api
          uv run python cli.py migrate | tee /tmp/unstamped.log
          grep -q "schema unstamped" /tmp/unstamped.log
          grep -q "added column course.about" /tmp/unstamped.log
          uv run python cli.py migrate --status

  images:
    needs: [api, web, helm, migrations]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            LEARNHOUSE_PUBLIC=true
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  promote:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - run: pip install PyYAML==6.0.3
      - name: Commit tested image versions for Argo CD
        env:
          IMAGE_TAG: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$IMAGE_TAG" ]; then
            echo "A newer main commit exists; its pipeline will promote production."
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          path = Path('deploy/gitops/values-production.yaml')
          values = yaml.safe_load(path.read_text())
          for service in ('api', 'web'):
              values[service]['image'] = {
                  'repository': f"ghcr.io/{os.environ['SOURCE_REPOSITORY'].lower()}-{service}",
                  'tag': os.environ['IMAGE_TAG'],
                  'pullPolicy': 'IfNotPresent',
              }
          path.write_text(yaml.safe_dump(values, sort_keys=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/gitops/values-production.yaml
          if ! git diff --cached --quiet; then
            git commit -m "deploy: promote tested images ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
