{{- range $component := list "api" "web" }}
{{- $settings := index $.Values $component }}
{{- $port := ternary 9000 3000 (eq $component "api") }}
{{- if $settings.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ $settings.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include "learnhouse.config" $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" $settings.image.repository $settings.image.tag | quote }}
          imagePullPolicy: {{ $settings.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
            {{- with $settings.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- $env := deepCopy $settings.env }}
          {{- if eq $component "api" }}
          {{- $storage := pick (include "learnhouse.config" $ | fromYaml) "LEARNHOUSE_CONTENT_DELIVERY_TYPE" "LEARNHOUSE_S3_API_REGION" "AWS_DEFAULT_REGION" }}
          {{- $env = mergeOverwrite $env $storage }}
          {{- end }}
          {{- with $env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ ternary "/api/v1/health/live" "/api/health" (eq $component "api") }}
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ ternary "/api/v1/health" "/api/health" (eq $component "api") }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ ternary "/api/v1/health/live" "/api/health" (eq $component "api") }}
              port: http
            periodSeconds: 20
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - {name: http, port: {{ $port }}, targetPort: http}
{{- end }}
{{- end }}
