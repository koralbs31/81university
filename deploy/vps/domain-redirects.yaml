apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: canonical-domain
  namespace: learnhouse
spec:
  redirectRegex:
    regex: '^https?://[^/]+(.*)'
    replacement: 'https://81university.com${1}'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnhouse-http-redirect
  namespace: learnhouse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: learnhouse-canonical-domain@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: 81university.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: learnhouse-web, port: {number: 3000}}
    - host: www.81university.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: learnhouse-web, port: {number: 3000}}
    - host: school.194.163.156.252.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: learnhouse-web, port: {number: 3000}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnhouse-domain-aliases
  namespace: learnhouse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: learnhouse-canonical-domain@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [www.81university.com]
      secretName: learnhouse-domain-tls
    - hosts: [school.194.163.156.252.sslip.io]
      secretName: learnhouse-tls
  rules:
    - host: www.81university.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: learnhouse-web, port: {number: 3000}}
    - host: school.194.163.156.252.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: learnhouse-web, port: {number: 3000}}
